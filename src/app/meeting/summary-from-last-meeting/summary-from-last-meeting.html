<div class="outer-box meeting-summary-box"
     style="background-color: ghostwhite; margin-top: -299px">

  <div class="card anim-up">

    <!-- Header -->
    <div class="card-header summary-card-header">
      <div class="summary-header-title">
        <span class="icon">
          <svg width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6"/>
          </svg>
        </span>
        <h3 class="card-title-desc">Summary from Last Meeting</h3>
      </div>

      <button
        type="button"
        class="approve-meeting-btn"
        [class.approved]="summaryData()?.isApproved === true"
        [disabled]="!summaryData() || summaryData()?.isApproved === true || isApproving"
        (click)="approveSummary()">

        {{
        isApproving
        ? 'Approving...'
        : summaryData()?.isApproved === true
        ? 'Approved by RM'
        : 'Approve'
        }}
      </button>
    </div>

    <!-- Existing summary -->
    <div *ngIf="summaryData() as summary">

      <p class="card-content-desc">Previous Meeting Date:</p>

      <div class="meeting-dropdown-row">
        <select
          class="meeting-dropdown"
          [value]="summary.lastMeetingDate"
          (change)="selectMeeting($any($event.target).value)">

          <option
            *ngFor="let meeting of meetingSummaries()"
            [value]="meeting.lastMeetingDate">
            {{ meeting.lastMeetingDate }}
          </option>

        </select>

        <button
          type="button"
          class="refresh-meeting-btn"
          [class.spinning]="isRefreshing"
          [disabled]="isRefreshing"
          aria-label="Refresh meeting summaries"
          title="Refresh"
          (click)="refreshSummaries()">

          <svg width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
          </svg>
        </button>
      </div>

      <p class="card-heading-desc">
        <span class="card-heading-content-desc">Main Discussion Points:</span>
        {{ summary.mainDiscussionPoints }}
      </p>

      <p class="card-heading-desc">
        <span class="card-heading-content-desc">Client Questions:</span>
        {{ summary.clientQuestions }}
      </p>

      <p *ngIf="summary.isApproved" class="approval-status">
        Approved by RM
        <span *ngIf="summary.approvedDatetime">
          on {{ summary.approvedDatetime | date:'medium' }}
        </span>
      </p>

    </div>

    <div *ngIf="!summaryData()">
      <p>Loading summary...</p>
    </div>

  </div>
</div>
